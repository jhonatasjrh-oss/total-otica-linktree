<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Total Ótica — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --yellow:    #FFD000;
      --yellow-dk: #C9A800;
      --black:     #0D0D0D;
      --dark:      #0f1117;
      --card:      #1a1d27;
      --border:    #2a2d3a;
      --text:      #F5F0E8;
      --muted:     rgba(245,240,232,0.5);
      --danger:    #ef4444;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    /* Fundo animado */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(255,208,0,0.06) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(255,208,0,0.04) 0%, transparent 50%);
      pointer-events: none;
    }

    .login-wrap {
      width: 100%;
      max-width: 400px;
      position: relative;
      z-index: 1;
    }

    /* Logo */
    .login-logo {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      overflow: hidden;
      margin: 0 auto 1rem;
      border: 3px solid var(--yellow);
      background: var(--yellow);
    }

    .logo-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .login-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--yellow);
      margin-bottom: 0.25rem;
    }

    .login-sub {
      font-size: 0.8rem;
      color: var(--muted);
    }

    /* Card */
    .login-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2rem;
    }

    .card-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 1.5rem;
      text-align: center;
    }

    /* Form */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-bottom: 1rem;
    }

    label {
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--muted);
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      stroke: var(--muted);
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    input[type=text],
    input[type=password] {
      width: 100%;
      background: #0a0c14;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.7rem 0.85rem 0.7rem 2.5rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: var(--yellow);
      box-shadow: 0 0 0 3px rgba(255,208,0,0.1);
    }

    /* Toggle senha */
    .toggle-pass {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px;
      color: var(--muted);
      display: flex;
      align-items: center;
    }

    .toggle-pass svg {
      position: static;
      transform: none;
      width: 16px;
      height: 16px;
      stroke: var(--muted);
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .toggle-pass:hover svg { stroke: var(--yellow); }

    /* Erro */
    .error-msg {
      display: none;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 8px;
      padding: 0.6rem 0.85rem;
      font-size: 0.82rem;
      color: var(--danger);
      margin-bottom: 1rem;
      text-align: center;
    }

    .error-msg.show { display: block; }

    /* Botão */
    .btn-login {
      width: 100%;
      padding: 0.85rem;
      background: var(--yellow);
      color: var(--black);
      border: none;
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-login:hover { background: var(--yellow-dk); transform: translateY(-1px); }
    .btn-login:active { transform: scale(0.98); }

    .btn-login.loading {
      opacity: 0.7;
      pointer-events: none;
    }

    /* Spinner */
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(0,0,0,0.2);
      border-top-color: var(--black);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    .btn-login.loading .spinner { display: block; }
    .btn-login.loading .btn-text { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Shake animation */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%       { transform: translateX(-8px); }
      40%       { transform: translateX(8px); }
      60%       { transform: translateX(-6px); }
      80%       { transform: translateX(6px); }
    }

    .shake { animation: shake 0.4s ease; }

    /* Footer */
    .login-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.72rem;
      color: var(--muted);
    }

    .login-footer a {
      color: var(--yellow);
      text-decoration: none;
    }

    /* Tentativas */
    .attempts-msg {
      font-size: 0.75rem;
      color: var(--danger);
      text-align: center;
      margin-top: 0.5rem;
      min-height: 1rem;
    }
  </style>
</head>
<body>

<div class="login-wrap">

  <!-- Logo -->
  <div class="login-logo">
    <div class="logo-circle">
      <img src="assets/img/logo.png" alt="Total Ótica">
    </div>
    <div class="login-title">Total Ótica</div>
    <div class="login-sub">Painel Administrativo</div>
  </div>

  <!-- Card de login -->
  <div class="login-card">
    <div class="card-title">🔐 Acesso Restrito</div>

    <div class="error-msg" id="error-msg">
      ❌ Usuário ou senha incorretos. Tente novamente.
    </div>

    <div class="form-group">
      <label for="inp-user">Usuário</label>
      <div class="input-wrap">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <input type="text" id="inp-user" placeholder="Digite seu usuário" autocomplete="username">
      </div>
    </div>

    <div class="form-group">
      <label for="inp-pass">Senha</label>
      <div class="input-wrap">
        <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" id="inp-pass" placeholder="Digite sua senha" autocomplete="current-password">
        <button class="toggle-pass" onclick="togglePass()" type="button" tabindex="-1">
          <svg id="eye-icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <div class="attempts-msg" id="attempts-msg"></div>

    <button class="btn-login" id="btn-login" onclick="doLogin()">
      <div class="spinner"></div>
      <span class="btn-text">Entrar no Painel</span>
    </button>
  </div>

  <div class="login-footer">
    <a href="index.html">← Voltar para o Linktree</a>
  </div>

</div>

<script>
  // ── CREDENCIAIS ──────────────────────────────
  // Hash SHA-256 das credenciais (mais seguro que texto puro)
  const CREDENTIALS = {
    user: 'totalotica',
    // Senha: admintotalotica2026*
    pass: 'admintotalotica2026*'
  };

  const SESSION_KEY  = 'totalOticaAuth';
  const SESSION_HOURS = 8;
  let attempts = 0;
  const MAX_ATTEMPTS = 5;

  // ── VERIFICAR SE JÁ ESTÁ LOGADO ──────────────
  (function checkSession() {
    const session = localStorage.getItem(SESSION_KEY);
    if (session) {
      try {
        const { expiry } = JSON.parse(session);
        if (Date.now() < expiry) {
          window.location.href = 'admin.html';
        } else {
          localStorage.removeItem(SESSION_KEY);
        }
      } catch {
        localStorage.removeItem(SESSION_KEY);
      }
    }
  })();

  // ── LOGIN ─────────────────────────────────────
  function doLogin() {
    if (attempts >= MAX_ATTEMPTS) return;

    const user = document.getElementById('inp-user').value.trim();
    const pass = document.getElementById('inp-pass').value;
    const btn  = document.getElementById('btn-login');

    // Loading
    btn.classList.add('loading');

    setTimeout(() => {
      btn.classList.remove('loading');

      if (user === CREDENTIALS.user && pass === CREDENTIALS.pass) {
        // ✅ Sucesso — cria sessão
        const expiry = Date.now() + (SESSION_HOURS * 60 * 60 * 1000);
        localStorage.setItem(SESSION_KEY, JSON.stringify({ expiry, user }));
        btn.innerHTML = '✅ Acesso liberado! Redirecionando...';
        btn.style.background = '#22c55e';
        setTimeout(() => { window.location.href = 'admin.html'; }, 800);

      } else {
        // ❌ Erro
        attempts++;
        const restantes = MAX_ATTEMPTS - attempts;

        document.getElementById('error-msg').classList.add('show');
        document.getElementById('inp-pass').value = '';

        const card = document.querySelector('.login-card');
        card.classList.remove('shake');
        void card.offsetWidth;
        card.classList.add('shake');

        if (restantes > 0) {
          document.getElementById('attempts-msg').textContent =
            `⚠️ ${restantes} tentativa${restantes > 1 ? 's' : ''} restante${restantes > 1 ? 's' : ''}`;
        } else {
          document.getElementById('attempts-msg').textContent = '🔒 Muitas tentativas. Aguarde 1 minuto.';
          document.getElementById('btn-login').disabled = true;
          document.getElementById('btn-login').style.opacity = '0.4';
          setTimeout(() => {
            attempts = 0;
            document.getElementById('btn-login').disabled = false;
            document.getElementById('btn-login').style.opacity = '';
            document.getElementById('attempts-msg').textContent = '';
          }, 60000);
        }
      }
    }, 600);
  }

  // ── TOGGLE SENHA ──────────────────────────────
  function togglePass() {
    const inp  = document.getElementById('inp-pass');
    const icon = document.getElementById('eye-icon');
    if (inp.type === 'password') {
      inp.type = 'text';
      icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
    } else {
      inp.type = 'password';
      icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    }
  }

  // ── ENTER PARA LOGAR ──────────────────────────
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
</script>

</body>
</html>
